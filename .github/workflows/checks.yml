name: Reusable distribution checks

on:
  workflow_call:
    inputs:
      bug:
        type: string
        default: fixed
      release-tag:
        type: string
        default: ''
    outputs:
      artifact-id:
        description: Exact artifact from this invocation, never a latest-by-name lookup
        value: ${{ jobs.build.outputs.artifact-id }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: plan
        env:
          BUG: ${{ inputs.bug }}
        run: python scripts/matrix_plan.py --bug "$BUG" --github-output "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: >-
          python -m pip --isolated install --index-url https://pypi.org/simple
          --no-cache-dir --only-binary=:all: --require-hashes -r requirements/ci.lock
      - name: Prepare candidate
        env:
          BUG: ${{ inputs.bug }}
        run: python scripts/inject_bug.py --bug "$BUG" --destination "$RUNNER_TEMP/candidate"
      - name: Lint
        working-directory: ${{ runner.temp }}/candidate
        run: ruff check .
      - name: Types
        working-directory: ${{ runner.temp }}/candidate
        # Explicit interpreter keeps the 3.10 fallback visible to the checker.
        run: pyright --pythonpath "$(command -v python)" src
      - name: Audit locked dependencies against current advisories
        run: python -m pip_audit --disable-pip --no-deps -r requirements/ci.lock
      - name: Unit tests with branch coverage
        working-directory: ${{ runner.temp }}/candidate
        run: python -m pytest --cov --cov-branch --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: >-
          python -m pip --isolated install --index-url https://pypi.org/simple
          --no-cache-dir --only-binary=:all: --require-hashes -r requirements/build.lock
      - name: Prepare candidate
        env:
          BUG: ${{ inputs.bug }}
        run: python scripts/inject_bug.py --bug "$BUG" --destination "$RUNNER_TEMP/candidate"
      - name: Build once and bind identities
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/build_release.py --source "$RUNNER_TEMP/candidate" --out "$RUNNER_TEMP/release" --tag "$RELEASE_TAG"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  consumers:
    needs: [build, plan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      # Fault demonstrations need only representative environments. Fixed releases
      # exercise every advertised Python minor on every advertised OS.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Verify source, tag, and distribution hashes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/bundle.py "$RUNNER_TEMP/release" --source-sha "$GITHUB_SHA" --tag "$RELEASE_TAG"
      - name: Install and launch wheel outside the checkout
        shell: bash
        run: python scripts/smoke_artifact.py --bundle "$RUNNER_TEMP/release" --kind wheel
      - name: Rebuild sdist and exercise another clean consumer
        shell: bash
        run: python scripts/smoke_artifact.py --bundle "$RUNNER_TEMP/release" --kind sdist

  docker:
    needs: build
    if: inputs.bug == 'fixed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ci-artifact
          merge-multiple: true
      - name: Verify the exact Actions distributions in Docker and build runtime
        run: docker build --target artifact-runtime --build-arg "SOURCE_SHA=$GITHUB_SHA" --tag soup-release-runtime .
      - name: Launch the unprivileged runtime image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges soup-release-runtime --version
