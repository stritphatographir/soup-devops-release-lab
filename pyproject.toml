[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soup-release-lab-amirt"
version = "0.9.4"
description = "A small configuration CLI used to test release pipeline failure modes"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
dependencies = ["tomli==2.2.1; python_version < '3.11'"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]

[project.scripts]
soup-check = "soup_release_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soup_release_lab = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra"

[tool.coverage.run]
source = ["soup_release_lab"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["tmp", ".tools", "evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

